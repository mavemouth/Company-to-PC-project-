<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTPC Hiring Request Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            line-height: 1.6;
            color: #333;
        }
        
        .container {
            max-width: 900px;
            margin: 20px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
        }
        
        .header h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #6c757d;
            font-size: 1.1em;
        }
        
        .form-section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 1.4em;
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
        }
        
        .section-title::before {
            content: '📋';
            margin-right: 10px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
        }
        
        label.required::after {
            content: ' *';
            color: #dc3545;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background-color: #fff;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }
        
        textarea {
            height: 120px;
            resize: vertical;
        }
        
        select[multiple] {
            height: 150px;
        }
        
        .btn {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 20px;
        }
        
        .btn:hover {
            background: linear-gradient(135deg, #0056b3, #004085);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,123,255,0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .status {
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            font-weight: 500;
        }
        
        .status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.loading {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #b6d7dc;
        }
        
        .help-text {
            font-size: 0.9em;
            color: #6c757d;
            margin-top: 5px;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .container {
                margin: 10px;
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>CTPC Hiring Request Form</h1>
            <p>Please fill out all required fields to submit your hiring request</p>
        </div>
        
        <form id="hiringForm">
            <!-- Company Information -->
            <div class="form-section">
                <h2 class="section-title">Company Information</h2>
                <div class="form-group">
                    <label for="companyName" class="required">Company Name</label>
                    <input type="text" id="companyName" name="companyName" required>
                </div>
            </div>

            <!-- Job Details -->
            <div class="form-section">
                <h2 class="section-title">Job Details</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="jobTitle" class="required">Job Title</label>
                        <input type="text" id="jobTitle" name="jobTitle" required>
                    </div>
                    <div class="form-group">
                        <label for="jobType" class="required">Job Type</label>
                        <select id="jobType" name="jobType" required>
                            <option value="">Select Job Type</option>
                            <option value="fulltime">Full Time</option>
                            <option value="internship">Internship</option>
                            <option value="parttime">Part Time</option>
                            <option value="contract">Contract</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="openings" class="required">Number of Openings</label>
                        <input type="number" id="openings" name="openings" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="ctc">CTC (in LPA)</label>
                        <input type="number" id="ctc" name="ctc" step="0.1" placeholder="e.g., 5.5">
                    </div>
                </div>
                
                <div class="form-group full-width">
                    <label for="jobDescription" class="required">Job Description</label>
                    <textarea id="jobDescription" name="jobDescription" required placeholder="Please provide detailed job description including responsibilities, requirements, and key skills..."></textarea>
                </div>
                
                <div class="form-group full-width">
                    <label for="skillsRequired" class="required">Skills Required</label>
                    <textarea id="skillsRequired" name="skillsRequired" required placeholder="List the key skills and technologies required for this position..."></textarea>
                </div>
            </div>

            <!-- Eligibility Criteria -->
            <div class="form-section">
                <h2 class="section-title">Eligibility Criteria</h2>
                <div class="form-group">
                    <label for="eligibleDepartments" class="required">Eligible Departments</label>
                    <select id="eligibleDepartments" name="eligibleDepartments" multiple required>
                        <option value="CSE">Computer Science & Engineering</option>
                        <option value="ECE">Electronics & Communication Engineering</option>
                        <option value="EEE">Electrical & Electronics Engineering</option>
                        <option value="MECH">Mechanical Engineering</option>
                        <option value="CIVIL">Civil Engineering</option>
                        <option value="IT">Information Technology</option>
                        <option value="MBA">MBA</option>
                        <option value="MCA">MCA</option>
                    </select>
                    <div class="help-text">Hold Ctrl/Cmd to select multiple departments</div>
                </div>
                
                <div class="form-group">
                    <label for="minCGPA">Minimum CGPA</label>
                    <input type="number" id="minCGPA" name="minCGPA" step="0.1" min="0" max="10" placeholder="e.g., 7.0">
                </div>
            </div>

            <!-- HR Contact Information -->
            <div class="form-section">
                <h2 class="section-title">HR Contact Information</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="hrName" class="required">HR Contact Name</label>
                        <input type="text" id="hrName" name="hrName" required>
                    </div>
                    <div class="form-group">
                        <label for="hrEmail" class="required">HR Contact Email</label>
                        <input type="email" id="hrEmail" name="hrEmail" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="hrPhone" class="required">HR Contact Phone</label>
                        <input type="tel" id="hrPhone" name="hrPhone" required>
                    </div>
                    <div class="form-group">
                        <label for="lastDate">Last Date to Apply</label>
                        <input type="date" id="lastDate" name="lastDate">
                    </div>
                </div>
            </div>

            <!-- Additional Information -->
            <div class="form-section">
                <h2 class="section-title">Additional Information</h2>
                <div class="form-group">
                    <label for="additionalInfo">Additional Information</label>
                    <textarea id="additionalInfo" name="additionalInfo" placeholder="Any additional information about the role, company culture, benefits, or special requirements..."></textarea>
                </div>
            </div>

            <div id="statusMessage"></div>
            
            <button type="submit" class="btn">Submit Hiring Request</button>
        </form>
    </div>

    <script>
        document.getElementById('hiringForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const statusDiv = document.getElementById('statusMessage');
            const submitBtn = this.querySelector('.btn');
            
            // Show loading state
            statusDiv.innerHTML = '<div class="status loading">🔄 Submitting form... Please wait.</div>';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            
            const formData = new FormData(this);
            const data = {};
            
            // Convert FormData to regular object
            for (let [key, value] of formData.entries()) {
                if (key === 'eligibleDepartments') {
                    if (!data[key]) data[key] = [];
                    data[key].push(value);
                } else {
                    data[key] = value;
                }
            }
            
            // Handle multiple select for departments
            const deptSelect = document.getElementById('eligibleDepartments');
            data.eligibleDepartments = Array.from(deptSelect.selectedOptions).map(option => option.value);
            
            try {
                console.log('Submitting data:', data);
                
                const response = await fetch('http://localhost:5000/api/hiring-requests', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    statusDiv.innerHTML = '<div class="status success">✅ Form submitted successfully! Request ID: ' + (result._id || 'Generated') + '</div>';
                    this.reset();
                    
                    // Scroll to success message
                    statusDiv.scrollIntoView({ behavior: 'smooth' });
                } else {
                    const error = await response.json();
                    statusDiv.innerHTML = '<div class="status error">❌ Error: ' + (error.message || 'Failed to submit form') + '</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                statusDiv.innerHTML = '<div class="status error">❌ Network error: Unable to connect to server. Make sure the backend is running on port 5000.</div>';
            } finally {
                // Reset button state
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Hiring Request';
                
                // Scroll to status message
                statusDiv.scrollIntoView({ behavior: 'smooth' });
            }
        });
        
        // Auto-resize textareas
        document.querySelectorAll('textarea').forEach(textarea => {
            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = this.scrollHeight + 'px';
            });
        });
    </script>
</body>
</html>
