<svg xmlns="http://www.w3.org/2000/svg" width="200" height="96" viewBox="0 0 200 96" fill="none">
  <rect width="200" height="96" fill="#1E40AF" rx="8"/>
  
  <!-- TIET Text -->
  <text x="100" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="white" font-weight="bold">TIET</text>
  
  <!-- Full Name -->
  <text x="100" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Thapar Institute of Engineering & Technology</text>
  
  <!-- Tagline -->
  <text x="100" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E0E7FF">(Deemed to be University)</text>
  
  <!-- Location -->
  <text x="100" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#C7D2FE">Patiala, Punjab, India</text>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="25" r="3" fill="white" opacity="0.8"/>
  <circle cx="170" cy="25" r="3" fill="white" opacity="0.8"/>
  <rect x="40" y="85" width="120" height="2" fill="white" opacity="0.6" rx="1"/>
</svg>